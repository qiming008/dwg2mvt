services:
  frontend:
    build:
      context: ./frontend
    image: libredwg-frontend:latest
    ports:
      - "19001:80"
    depends_on:
      - backend
      - csrap_geoserver

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: libredwg-backend:latest
    entrypoint:
      - python3
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --loop
      - asyncio
      - --http
      - h11
    ports:
      - "19010:8000"
    environment:
      APP_WORK_DIR: /app/backend/data
      APP_DWG2DXF_CMD: dwg2dxf
      APP_DWG2SVG_CMD: dwg2SVG
      APP_ORIGINAL_PREVIEW_TIMEOUT_SECONDS: "300"
      APP_ORIGINAL_PREVIEW_TEMP_DIR: /tmp/libredwg_original_preview
      APP_OGR2OGR_CMD: ogr2ogr
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      APP_GEOSERVER_URL: http://geoserver:8080/geoserver
      APP_GEOSERVER_PUBLIC_URL: /csrap_geoserver
      APP_GEOSERVER_USER: admin
      APP_GEOSERVER_PASSWORD: geoserver
      APP_GEOSERVER_WORKSPACE: dwg
      APP_DICT_SERVICE_BASE_URL: http://172.24.4.66
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      - csrap_geoserver
    security_opt:
      - seccomp=unconfined

  csrap_geoserver:
    build:
      context: ./geoserver_docker
      dockerfile: Dockerfile
    image: libredwg-geoserver:2.28.2
    ports:
      - "19080:8080"
    environment:
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_HOME: /opt/geoserver
      GEOSERVER_DATA_DIR: /opt/geoserver_data/
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "vectortiles"
    volumes:
      - ./backend/data:/app/backend/data:ro
      - csrap_geoserver_data:/opt/geoserver_data/
    security_opt:
      - seccomp=unconfined
    networks:
      default:
        aliases:
          - geoserver

volumes:
  csrap_geoserver_data: {}

networks:
  default:
    ipam:
      config:
        - subnet: 172.25.25.0/24
